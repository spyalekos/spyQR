[project]
name = "spyqr"
version = "0.2.7"
description = "SpyQR - Έξυπνος Σαρωτής & Δημιουργός QR Codes και Barcodes (1D/2D)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "SpyAlekos", email = "alekos@program.gr" }
]
dependencies = [
    "flet>=1.0.4",
    "flet-audio>=1.0.4",
    "flet-permission-handler>=1.0.4",
    "flet-spinkit>=1.0.4",
    "flet-code-editor>=1.0.4",
    "flet-color-pickers>=1.0.4",
    "flet-secure-storage>=1.0.4",
    "flet-charts>=1.0.4",
    "flet-datatable2>=1.0.4",
    "flet-map>=1.0.4",
    "flet-webview>=1.0.4",
    "flet-flashlight>=1.0.4",
    "flet-geolocator>=1.0.4",
    "qrcode[pil]>=8.0",
    "pillow>=11.0",
    "python-barcode>=0.16.1",
]

[dependency-groups]
dev = [
    "flet-desktop>=1.0.4",
    "flet-camera>=1.0.4",
    "flet-lottie>=1.0.4",
    "opencv-python>=4.10.0",
    "numpy>=2.0",
    "zxing-cpp>=3.1.1",
    "pyinstaller>=6.22.3",
    "watchdog>=6.0.0",
]

[tool.flet]
org = "gr.spyalekos"
product = "SpyQR"
company = "SpyAlekos"
copyright = "Copyright (C) 2026 SpyAlekos"
build_number = 1
version = "0.2.7"

[tool.flet.app]
path = "src"
module = "main"

[tool.flet.android]
package = "gr.spyalekos.spyqr"

[tool.flet.android.permission]
"android.permission.INTERNET" = true
"android.permission.CAMERA" = true

[tool.flet.android.gradle_properties]
"org.gradle.jvmargs" = "-Xmx896m -Xms128m -XX:MaxMetaspaceSize=256m -XX:ReservedCodeCacheSize=64m -XX:+UseSerialGC -Dfile.encoding=UTF-8"
"org.gradle.daemon" = "false"
"org.gradle.parallel" = "false"
"org.gradle.workers.max" = "1"
"org.gradle.vfs.watch" = "false"
"kotlin.incremental" = "false"
"kotlin.compiler.execution.strategy" = "in-process"
"android.enableJetifier" = "false"

[tool.flet.plugins]
flet_audio = "Audio"
flet_permission_handler = "PermissionHandler"
flet_secure_storage = "SecureStorage"
flet_flashlight = "Flashlight"
flet_geolocator = "Geolocator"
flet_spinkit = "SpinKit"
flet_code_editor = "CodeEditor"
flet_color_pickers = "ColorPicker"
flet_datatable2 = "DataTable2"
flet_map = "Map"
flet_webview = "WebView"
